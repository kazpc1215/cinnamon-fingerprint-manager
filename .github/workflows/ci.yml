name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .

  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - name: Pytest
        run: uv run pytest -q

  gui:
    name: GTK UI smoke
    runs-on: ubuntu-24.04
    # apt のミラーが応答しない場合に備えて打ち切る
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install GTK and Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-gtk-3.0 xvfb
      - name: Build and draw the window
        run: xvfb-run -a env PYTHONPATH=src /usr/bin/python3 tests/gui_smoke.py
