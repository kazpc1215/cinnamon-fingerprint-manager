name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint & test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Pytest
        run: uv run pytest -q

  gui-import:
    name: GTK import (real bindings)
    runs-on: ubuntu-24.04
    # apt のミラーが応答しない場合に備えてジョブ全体を打ち切る
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Install GTK bindings
        run: |
          set -euo pipefail
          packages="python3-gi gir1.2-gtk-3.0"
          # ランナー同梱のパッケージリストをまず使い、失敗したときだけ update する
          if ! sudo timeout 120 apt-get install -y --no-install-recommends $packages; then
            echo "同梱リストでは導入できなかったため apt-get update します"
            sudo timeout 120 apt-get update \
              -o Acquire::Retries=3 -o Acquire::http::Timeout=20
            sudo timeout 120 apt-get install -y --no-install-recommends $packages
          fi
      - name: Import GUI module with real GTK
        run: |
          PYTHONPATH=src /usr/bin/python3 -c \
            "import cinnamon_fingerprint_manager.gui as gui; print('GTK import OK:', gui.APP_TITLE)"
