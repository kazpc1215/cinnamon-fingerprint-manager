name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    name: Lint & test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Pytest
        run: uv run pytest -q

  gui-smoke:
    name: GUI import smoke test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install system GTK bindings
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-gtk-3.0
      - name: Import GUI module
        run: |
          PYTHONPATH=src /usr/bin/python3 -c \
            "import cinnamon_fingerprint_manager.gui as gui; print('GUI module OK:', gui.APP_TITLE)"
