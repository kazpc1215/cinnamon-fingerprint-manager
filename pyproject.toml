[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "cinnamon-fingerprint-manager"
dynamic = ["version"]
description = "GTK3 GUI to enroll, verify and delete fingerprints with fprintd on Linux Mint / Cinnamon"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "kazpc1215" }]
keywords = ["fingerprint", "fprintd", "gtk3", "cinnamon", "linux-mint"]
classifiers = [
    "Environment :: X11 Applications :: GTK",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: System :: Systems Administration",
]

[project.urls]
Homepage = "https://github.com/kazpc1215/cinnamon-fingerprint-manager"
Repository = "https://github.com/kazpc1215/cinnamon-fingerprint-manager"
Issues = "https://github.com/kazpc1215/cinnamon-fingerprint-manager/issues"

[project.scripts]
cinnamon-fingerprint-manager = "cinnamon_fingerprint_manager.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "ruff>=0.9.0",
]

[tool.uv]
package = true

[tool.hatch.version]
path = "src/cinnamon_fingerprint_manager/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/cinnamon_fingerprint_manager"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF"]
# 日本語の全角括弧などは意図的なので許可する
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["cinnamon_fingerprint_manager"]

[tool.coverage.report]
show_missing = true
skip_covered = true
